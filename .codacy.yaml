# Opengrep's temporary-folder rules are about production code, so it does not scan
# tests (tests/ folders and tests.rs modules at any depth); shipped code and xtask
# are still scanned. Lizard's file-size check skips lockfiles, which Cargo and npm
# generate.
engines:
  opengrep:
    exclude_paths:
      - "tests/**"
      - "**/tests/**"
      - "**/tests.rs"
  lizard:
    exclude_paths:
      - "Cargo.lock"
      - "**/Cargo.lock"
      - "**/package-lock.json"
