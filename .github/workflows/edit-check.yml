name: Edit terminal check

on:
  push:
    branches: [ryan/terminal-editor-2026-11-15]

permissions:
  contents: read

jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release --bin apollinaire
      - run: timeout 600 python3 -u -I .github/edit-check/pty.py target/release/apollinaire "$RUNNER_TEMP/after"
      - if: always()
        run: ps -axo pid,stat,wchan,command | grep -i apollinaire | grep -v grep || true
