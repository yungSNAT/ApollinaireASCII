name: Edit terminal check

on:
  push:
    branches: [ryan/terminal-editor-2026-11-15]

permissions:
  contents: read

jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - name: Probe a hung-up pseudo-terminal
        run: python3 -I -c "import os,pty,termios; m,s=pty.openpty(); os.close(m); print('isatty', os.isatty(s)); print('read', os.read(s, 10))" || true
      - name: Before, save fix (expect the new test to fail)
        run: |
          git show 6273fbb:src/edit.rs > src/edit.rs
          if cargo test --locked --bin apollinaire temporary_name; then echo "BEFORE-SAVE: passed (unexpected)"; else echo "BEFORE-SAVE: failed as expected"; fi
          git checkout -- src/edit.rs
      - name: Before, input-closed fix (pseudo-terminal cases on the previous code)
        run: |
          git show a04ab8b:src/edit.rs > src/edit.rs
          cargo build --locked --release --bin apollinaire
          python3 -I .github/edit-check/pty.py target/release/apollinaire "$RUNNER_TEMP/before" || echo "BEFORE-PTY: some cases failed"
          git checkout -- src/edit.rs
      - run: cargo test --locked edit
      - run: cargo build --locked --release --bin apollinaire
      - run: python3 -I .github/edit-check/pty.py target/release/apollinaire "$RUNNER_TEMP/after"
