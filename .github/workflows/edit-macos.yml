name: Edit on macOS

on:
  push:
    branches: [ryan/terminal-editor-2026-11-15]

permissions:
  contents: read

jobs:
  pty:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --locked edit
      - run: cargo build --locked --release --bin apollinaire
      - run: python3 -I .github/edit-check/pty.py target/release/apollinaire "$RUNNER_TEMP/pty"
