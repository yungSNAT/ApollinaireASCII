name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A rerun after a partial failure reuses the draft; a published release is never touched.
      - run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Completions and the manual page are the same on every platform, so they are generated once.
  manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate completions and the manual page
        run: |
          cargo build --locked
          mkdir -p manuals/completions manuals/man
          for shell in bash fish powershell zsh; do
            case $shell in
              bash) file=apollinaire.bash ;;
              fish) file=apollinaire.fish ;;
              powershell) file=apollinaire.ps1 ;;
              zsh) file=_apollinaire ;;
            esac
            target/debug/apollinaire completions "$shell" > "manuals/completions/$file"
          done
          target/debug/apollinaire man > manuals/man/apollinaire.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuals
          path: manuals
          retention-days: 1

  binaries:
    needs: [draft, manuals]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manuals
          path: manuals
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="apollinaire-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name" upload
          cp README.md LICENSE.md THIRD_PARTY_NOTICES.md "$name"/
          cp web/THIRD_PARTY_NOTICES.txt "$name/DEPENDENCY_NOTICES.txt"
          cp -r LICENSES manuals/completions manuals/man "$name"/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/apollinaire.exe" "$name"/
            7z a "upload/$name.zip" "$name" > /dev/null
          else
            cp "target/$TARGET/release/apollinaire" "$name"/
            tar -czf "upload/$name.tar.gz" "$name"
          fi
          if [[ "$TARGET" == *linux* ]]; then
            arch=amd64
            if [[ "$TARGET" == aarch64-* ]]; then arch=arm64; fi
            version=${GITHUB_REF_NAME#v}
            # Debian sorts 0.4.0~rc.1 before 0.4.0; 0.4.0-rc.1 would read as revision rc.1 of 0.4.0.
            bash .github/scripts/deb.sh "$name" "${version/-/\~}" "$arch" "upload/apollinaire_${version}_$arch.deb"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: upload/*
      - run: gh release upload "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The formula and manifest are attached for a Homebrew tap and a Scoop bucket; adding them
      # there is a separate step. Their own sums join the archives' in SHA256SUMS.txt.
      - name: Checksums, Homebrew formula and Scoop manifest
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "apollinaire-$GITHUB_REF_NAME-*" --pattern "apollinaire_*.deb"
          sha256sum -- * > SHA256SUMS.txt
          bash ../.github/scripts/manifests.sh "$GITHUB_REF_NAME" SHA256SUMS.txt .
          sha256sum -- apollinaire.rb apollinaire.json >> SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt apollinaire.rb apollinaire.json --repo "$GITHUB_REPOSITORY" --clobber
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # crates.io trusted publishing: the crate's trusted publisher names this workflow file and the
  # crates-io environment, which accepts only v* tags. No long-lived token is stored.
  crate:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "apollinaire-ascii") | .version')
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml says '$version' but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      # Build and verify before the token exists, so no build script can read it.
      - run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
