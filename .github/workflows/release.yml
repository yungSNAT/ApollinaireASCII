name: Release

on:
  push:
    tags: ['v*']
  # A dry run: a pull request that changes this workflow or its packaging scripts, or a manual run,
  # builds every archive, Debian and RPM package, manifest and the crate as a tag would, named for the
  # Cargo.toml version. Only a tag publishes, attests or asks crates.io for a token.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - xtask/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A v* tag releases only a commit whose 'Checks and browser' run on a push to master passed, so a
  # stray or early tag publishes nothing to GitHub Releases or crates.io. Every other job needs it.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a passing checks.yml run on master for the tagged commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?branch=master&event=push&status=success&head_sha=$GITHUB_SHA" --jq .total_count)
          if [ "$passed" -lt 1 ]; then
            echo "::error::$GITHUB_REF_NAME is at $GITHUB_SHA, which has no passing checks.yml run on master. Tag a commit on master once its checks pass, or rerun this workflow after they do."
            exit 1
          fi

  # Completions and the manual page are the same on every platform, so they are generated once.
  manuals:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate completions and the manual page
        run: |
          cargo build --locked
          mkdir -p manuals/completions manuals/man
          for shell in bash fish powershell zsh; do
            case $shell in
              bash) file=apollinaire.bash ;;
              fish) file=apollinaire.fish ;;
              powershell) file=apollinaire.ps1 ;;
              zsh) file=_apollinaire ;;
            esac
            target/debug/apollinaire completions "$shell" > "manuals/completions/$file"
          done
          target/debug/apollinaire man > manuals/man/apollinaire.1
      # The tag names every archive; a dry run names them for the Cargo.toml version.
      - id: tag
        run: |
          tag=$GITHUB_REF_NAME
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "apollinaire-ascii") | .version')
            [ -n "$version" ] || { echo "::error::Cargo.toml has no apollinaire-ascii version"; exit 1; }
            tag=v$version
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuals
          path: manuals
          retention-days: 1

  # The build jobs run dependency build scripts, so they hold a read-only token and hand their
  # archives to publish, the one job that can sign, upload or release.
  binaries:
    needs: [gate, manuals]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(matrix.target, 'musl')
        # rpm gives rpmbuild for the .rpm package.
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manuals
          path: manuals
      - name: Package
        env:
          TAG: ${{ needs.manuals.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="apollinaire-$TAG-$TARGET"
          mkdir "$name" upload
          cp README.md LICENSE.md THIRD_PARTY_NOTICES.md "$name"/
          cp web/THIRD_PARTY_NOTICES.txt "$name/DEPENDENCY_NOTICES.txt"
          cp -r LICENSES manuals/completions manuals/man "$name"/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/apollinaire.exe" "$name"/
            7z a "upload/$name.zip" "$name" > /dev/null
          else
            cp "target/$TARGET/release/apollinaire" "$name"/
            tar -czf "upload/$name.tar.gz" "$name"
          fi
          if [[ "$TARGET" == *linux* ]]; then
            arch=amd64
            if [[ "$TARGET" == aarch64-* ]]; then arch=arm64; fi
            version=${TAG#v}
            # Debian sorts 0.4.0~rc.1 before 0.4.0; 0.4.0-rc.1 would read as revision rc.1 of 0.4.0.
            cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- deb "$name" "${version/-/\~}" "$arch" "upload/apollinaire_${version}_$arch.deb"
            rpm_arch=x86_64
            if [[ "$TARGET" == aarch64-* ]]; then rpm_arch=aarch64; fi
            # RPM, like Debian, sorts a ~ prerelease first and refuses a - in a version.
            cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- rpm "$name" "${version/-/\~}" "$rpm_arch" "upload/apollinaire-${version}-1.$rpm_arch.rpm"
          fi
      - name: Query the .rpm, install it in an empty root and run it
        if: contains(matrix.target, 'linux')
        run: |
          rpm_file=(upload/*.rpm)
          rpm -qip "${rpm_file[0]}"
          rpm -qlp "${rpm_file[0]}"
          root="$RUNNER_TEMP/rpm-root"
          sudo rpm --root "$root" --initdb
          sudo rpm --root "$root" -i "${rpm_file[0]}"
          sudo rpm --root "$root" -V apollinaire
          "$root/usr/bin/apollinaire" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upload-${{ matrix.target }}
          path: upload/*
          if-no-files-found: error
          # Kept for a week so a failed publish can be re-run without rebuilding.
          retention-days: 7

  # The checksums, Homebrew formula and Scoop manifest are made here, with a read-only token, so
  # publish builds and runs no repository code. A dry run ends here.
  release-files:
    needs: [manuals, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: upload-*
          path: assets
          merge-multiple: true
      - name: Prepare release-files directory
        run: mkdir -p release-files
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          syft-version: v1.51.0
          output-file: release-files/apollinaire-${{ needs.manuals.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Formula/ holds the tap's copy of the formula: after a release, a pull request replaces it
      # with this one. The formula's, manifest's and SBOM's own sums join the archives' in SHA256SUMS.txt.
      - name: Checksums, Homebrew formula and Scoop manifest
        working-directory: assets
        env:
          TAG: ${{ needs.manuals.outputs.tag }}
        run: |
          jq -e '.spdxVersion and (.packages | length > 0)' "../release-files/apollinaire-$TAG.spdx.json" > /dev/null
          sha256sum -- * > SHA256SUMS.txt
          cargo run --locked --quiet --manifest-path ../xtask/Cargo.toml -- manifests "$TAG" SHA256SUMS.txt ../release-files
          cd ../release-files
          sha256sum -- apollinaire.rb apollinaire.json "apollinaire-$TAG.spdx.json" >> ../assets/SHA256SUMS.txt
          mv ../assets/SHA256SUMS.txt .
          ruby -c apollinaire.rb
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [manuals, binaries, crate-check, release-files]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write # Record the archives' provenance attestations.
      contents: write # Create the draft release, upload its assets and publish it.
      id-token: write # Sign the attestations.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: upload-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # The sums were made from the same artifacts in release-files; refuse an archive that differs.
      - name: Check the archives against SHA256SUMS.txt
        working-directory: assets
        run: grep -vE ' (apollinaire\.(rb|json)|apollinaire-.*\.spdx\.json)$' ../release-files/SHA256SUMS.txt | sha256sum --check --strict
      - name: Check the SPDX SBOM against SHA256SUMS.txt
        working-directory: release-files
        run: grep -E ' apollinaire-.*\.spdx\.json$' SHA256SUMS.txt | sha256sum --check --strict
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: assets/*
      - name: Attest the SPDX SBOM for the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
          sbom-path: release-files/apollinaire-${{ needs.manuals.outputs.tag }}.spdx.json
      # The signed attestation is also attached, so the archives can be checked offline with
      # `gh attestation verify --bundle` and the release counts as signed.
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "release-files/apollinaire-$GITHUB_REF_NAME.sigstore.json"
      # A rerun after a partial failure reuses the draft; a published release is never touched.
      - name: Draft the release and upload the archives
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" assets/* release-files/* --repo "$GITHUB_REPOSITORY" --clobber
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # cargo package builds the crate and runs its dependencies' build scripts, so it runs here,
  # without the id-token permission that trusted publishing needs.
  crate-check:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "apollinaire-ascii") | .version')
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml says '$version' but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: cargo package --locked

  # crates.io trusted publishing: the crate's trusted publisher names this workflow file and the
  # crates-io environment, which accepts only v* tags. No long-lived token is stored. --no-verify
  # skips the build crate-check already ran, so no build code runs where the token can be minted.
  crate:
    needs: [publish, crate-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      # nosemgrep: codacy.yaml.security.hard-coded-tokens -- a GitHub permission scope for trusted publishing, not a token
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
