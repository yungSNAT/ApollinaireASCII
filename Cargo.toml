[package]
name = "apollinaire-ascii"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Static art, block lettering and animation as real ASCII text"
repository = "https://github.com/yungSNAT/ApollinaireASCII"
homepage = "https://yungsnat.github.io/ApollinaireASCII/"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images", "text-processing", "wasm"]
# notices.rs checks web/, which the package leaves out.
include = ["/src", "/tests", "!/tests/notices.rs", "/examples", "/LICENSES", "/README.md", "/LICENSE.md", "/THIRD_PARTY_NOTICES.md"]
keywords = ["ascii", "art", "figlet", "animation", "wasm"]

# `cargo binstall apollinaire-ascii` installs the release archive's binary instead of building it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/apollinaire-v{ version }-{ target }.tar.gz"
bin-dir = "apollinaire-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-url = "{ repo }/releases/download/v{ version }/apollinaire-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "apollinaire"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:ureq"]
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "pnm"] }
serde = "1"
serde_json = "1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
weezl = "0.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlAnchorElement", "Event", "BeforeUnloadEvent", "EventTarget", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "MediaQueryList", "Performance", "VisibilityState", "AbortController", "AbortSignal", "AddEventListenerOptions", "DomException", "HtmlMediaElement", "HtmlProgressElement", "HtmlVideoElement", "ImageData", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "PointerEvent", "MouseEvent", "KeyboardEvent", "ClipboardEvent", "DataTransfer", "DomRect", "DomRectReadOnly", "FocusOptions", "Crypto", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
web-sys = { version = "0.3.107", features = ["PointerEventInit", "KeyboardEventInit", "ClipboardEventInit", "Selection", "DataTransferItemList", "DataTransferItem", "EventInit", "Response", "CssStyleDeclaration"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
ref_option = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
