# Box designs drawn for ApollinaireASCII, written in the design-file format of the boxes
# program. Each SAMPLE is the design drawn around "Hi"; a test checks it.

BOX curly
sample
.~~~~.
{ Hi }
'~~~~'
ends
shapes {
    nw (".") n ("~") ne (".")
    w ("{") e ("}")
    sw ("'") s ("~") se ("'")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END curly

BOX zigzag
sample
+/\/\+
< Hi >
+\/\/+
ends
shapes {
    nw ("+") n ("/\\") ne ("+")
    w ("<") e (">")
    sw ("+") s ("\\/") se ("+")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END zigzag

BOX rail
sample
o======o
|| Hi ||
o======o
ends
shapes {
    nw ("o=") n ("=") ne ("=o")
    w ("||") e ("||")
    sw ("o=") s ("=") se ("=o")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END rail

BOX film
sample
+------+
|[] [] |
|  Hi  |
|[] [] |
+------+
ends
shapes {
    nw ("+", "|") n ("---", "[] ") ne ("+", "|")
    w ("|") e ("|")
    sw ("|", "+") s ("[] ", "---") se ("|", "+")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END film

BOX ticket
sample
/~~~~\
| Hi |
\~~~~/
ends
shapes {
    nw ("/") n ("~") ne ("\\")
    w ("|") e ("|")
    sw ("\\") s ("~") se ("/")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END ticket

BOX shadow
sample
+----+
| Hi |#
+----+#
 ######
ends
shapes {
    nw ("+") n ("-") ne ("+ ")
    w ("|") e ("|#")
    sw ("+", " ") s ("-", "#") se ("+#", "##")
}
elastic (n, e, s, w)
padding { horizontal 1 }
END shadow

BOX bracket
sample
+-  -+
| Hi |
+-  -+
ends
shapes {
    nw ("+-") ne ("-+")
    w ("| ") e (" |")
    sw ("+-") se ("-+")
}
elastic (e, w)
END bracket

BOX crest
sample
+=<o>=+
| Hi  |
+=====+
ends
shapes {
    nw ("+") nnw ("=") n ("<o>") nne ("=") ne ("+")
    w ("|") e ("|")
    sw ("+") s ("=") se ("+")
}
elastic (nnw, nne, e, s, w)
padding { horizontal 1 }
END crest
